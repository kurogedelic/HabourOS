# Cardputer Zero: original HarbourOS four-step amber palette.
# Macintosh-like geometry comes from compact layout, not a new color scheme.
# No extra colors: keep the exact palette used by assets/themes/default.yaml.
name: cardputer-zero
colors:
  palette:
    - "#000000" # background
    - "#3a2108" # deepest amber
    - "#9a5a12" # muted amber
    - "#ffb040" # foreground
  topbar_bg: "#000000"
