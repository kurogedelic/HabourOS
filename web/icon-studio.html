<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFE8B8">
<title>Harbour Icons</title>
<style>
:root{color-scheme:light;--ink:#382209;--mid:#b8945c;--desktop:#f0d6a0;--paper:#ffe8b8;--line:rgba(56,34,9,.30);--wash:rgba(56,34,9,.055);--active:rgba(56,34,9,.11)}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--desktop);color:var(--ink);font:14px/1.35 system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,.file-button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
svg{display:block;width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px max(18px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:var(--paper)}
.brand{display:flex;align-items:baseline;gap:9px;letter-spacing:-.035em;white-space:nowrap}
.brand strong{font-size:19px;font-weight:750}
.brand span{font-size:14px;font-weight:450;opacity:.7}
.header-actions{display:flex;gap:7px;align-items:center}
.action,.file-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:44px;min-height:42px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:transparent;font-size:12px;font-weight:600;white-space:nowrap}
.action:hover,.file-button:hover{background:var(--active)}
.action svg,.file-button svg{width:15px;height:15px}
.layout{display:grid;grid-template-columns:clamp(214px,23vw,288px) minmax(0,1fr);gap:13px;max-width:1290px;margin:auto;padding:14px}
.panel{min-width:0;border:1px solid var(--line);border-radius:11px;background:var(--paper);overflow:hidden}
.library{display:flex;flex-direction:column;height:calc(100dvh - 96px);min-height:390px}
.library-head{display:flex;justify-content:space-between;align-items:center;padding:14px 13px 8px}
.library-head strong{font-weight:700;font-size:17px;letter-spacing:-.025em}
.sub,.index-info{font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}
.search-wrap{padding:0 12px 10px}
#search{width:100%;height:37px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:rgba(255,255,255,.28);outline-offset:1px}
#search::placeholder{color:var(--ink);opacity:.5}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;overflow:auto;padding:7px 9px 18px;align-content:start;-webkit-overflow-scrolling:touch}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;min-height:77px;padding:7px 2px;border:1px solid transparent;background:var(--wash);border-radius:6px;color:var(--ink)}
.tile:hover{border-color:var(--mid)}
.tile[aria-pressed="true"]{border:1px solid var(--ink);background:var(--active)}
.tile canvas{width:40px;height:40px;image-rendering:pixelated;image-rendering:crisp-edges;background-color:var(--paper);background-image:linear-gradient(45deg,var(--desktop) 25%,transparent 25%),linear-gradient(-45deg,var(--desktop) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,var(--desktop) 75%),linear-gradient(-45deg,transparent 75%,var(--desktop) 75%);background-size:10px 10px;background-position:0 0,0 5px,5px -5px,-5px 0}
.tile .number{font-size:10px;opacity:.6;font-variant-numeric:tabular-nums}
.tile .filename{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.editor{padding:18px}
.editor-top{display:flex;align-items:center;gap:14px;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:13px}
#iconName{width:100%;min-width:0;max-width:450px;height:40px;padding:6px 9px;border:1px solid transparent;background:transparent;border-radius:6px;font-size:18px;font-weight:600;letter-spacing:-.025em}
#iconName:focus{background:var(--desktop);border-color:var(--line);outline:none}
.namegroup{flex:1;min-width:0}.index-info{white-space:nowrap}
.workspace{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start;justify-content:center;padding:20px 2px 2px}
.stage{flex:1 1 360px;max-width:min(520px,62vh);min-width:260px}
.artboard{position:relative;width:100%;aspect-ratio:1;border:1px solid var(--mid);border-radius:3px;overflow:hidden;background-color:var(--paper);background-image:linear-gradient(45deg,var(--desktop) 25%,transparent 25%),linear-gradient(-45deg,var(--desktop) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,var(--desktop) 75%),linear-gradient(-45deg,transparent 75%,var(--desktop) 75%);background-size:22px 22px;background-position:0 0,0 11px,11px -11px,-11px 0;touch-action:none}
#canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:crosshair}
.artboard.grid-on::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,rgba(56,34,9,.17) 1px,transparent 1px),linear-gradient(to bottom,rgba(56,34,9,.17) 1px,transparent 1px);background-size:calc(100% / 24) calc(100% / 24);background-position:-1px -1px}
.stage-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;font-size:11px;opacity:.7}
.checkbox-row{display:inline-flex;align-items:center;gap:7px;min-height:33px;cursor:pointer;font-size:12px}
.checkbox-row input{width:17px;height:17px;accent-color:var(--ink)}
.tools{width:186px;flex:0 0 186px;display:flex;flex-direction:column;gap:15px}
.tool-grid,.tool-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tool-row{grid-template-columns:repeat(3,minmax(0,1fr))}
.tool-grid .icon-button,.tool-row .icon-button{width:100%}
.icon-button{display:inline-flex;justify-content:center;align-items:center;min-width:44px;min-height:47px;padding:7px;border:1px solid var(--line);border-radius:7px;background:transparent}
.icon-button:hover{background:var(--active)}
.icon-button.active{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.palette{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.swatch{position:relative;width:100%;aspect-ratio:1;border:1px solid var(--line);border-radius:5px;padding:0;outline-offset:2px}
.swatch.selected{outline:2px solid var(--ink);outline-offset:2px}
.status{font-size:11px;opacity:.65;min-height:18px;text-align:center}
.tool-divider{height:1px;background:var(--line)}
.visually-hidden{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
#fileInput,#pngInput{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media(max-width:1020px){.layout{grid-template-columns:210px minmax(0,1fr)}.workspace{gap:13px}.tools{width:100%;flex:1 1 100%;max-width:520px;flex-direction:row;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px}.tool-grid{flex:1 1 190px;max-width:240px}.palette{width:170px}.tool-row{width:158px}.tool-divider{display:none}.status{display:none}.stage{flex:1 1 100%;min-width:0;max-width:min(540px,58vh)}}
@media(max-width:720px){.topbar{padding:10px 11px}.brand strong{font-size:17px}.brand span{font-size:12px}.header-actions{gap:5px}.action,.file-button{min-width:40px;min-height:39px;padding:7px;font-size:11px}.layout{display:flex;flex-direction:column;gap:9px;padding:9px}.library{height:auto;min-height:0}.library-head{padding:9px 11px 5px}.library-head strong{font-size:14px}.search-wrap{padding:0 10px 7px}#search{height:32px}.tiles{display:flex;gap:5px;padding:3px 9px 9px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity}.tile{flex:0 0 66px;min-height:70px;scroll-snap-align:start}.tile canvas{width:35px;height:35px}.editor{padding:11px}.editor-top{padding-bottom:9px}.workspace{padding-top:12px;gap:13px}.stage{max-width:min(100%,min(500px,62dvh));flex:1 1 100%}.tools{justify-content:center}.tool-grid{flex:1 1 160px}.palette{width:142px}.tool-row{width:144px}}
</style>
</head>

<body>
<header class="topbar">
  <div class="brand"><strong>Harbour</strong><span>Icons</span></div>
  <div class="header-actions">
    <button type="button" class="action" id="exportJson" title="Export project JSON" aria-label="Export JSON">JSON <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/></svg></button>
    <button type="button" class="action" id="exportZip" title="Export 128 transparent PNGs" aria-label="Export PNG ZIP">PNG <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/></svg></button>
    <label class="file-button" for="fileInput" title="Import JSON project" aria-label="Import JSON"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V9m-4 4 4-4 4 4M4 7V4h16v3"/></svg><span class="visually-hidden">Import JSON</span></label>
    <input type="file" id="fileInput" accept=".json,application/json">
  </div>
</header>
<main class="layout">
  <section class="panel library" aria-label="128 icons">
    <div class="library-head"><strong>128</strong><span class="sub" id="progress">0 / 128</span></div>
    <div class="search-wrap"><input type="search" id="search" placeholder="Search" aria-label="Search icons" autocomplete="off"></div>
    <div class="tiles" id="tiles"></div>
  </section>
  <section class="panel editor" aria-label="Pixel editor">
    <div class="editor-top">
      <div class="namegroup"><label class="visually-hidden" for="iconName">Icon name</label><input type="text" id="iconName" maxlength="60" autocomplete="off" spellcheck="false"></div>
      <span class="index-info" id="indexInfo">001 / 128</span>
    </div>
    <div class="workspace">
      <div class="stage">
        <div class="artboard grid-on" id="artboard">
          <canvas id="canvas" width="24" height="24" aria-label="Draw icon in a 24 by 24 pixel canvas"></canvas>
        </div>
        <div class="stage-foot"><span id="pixelInfo">24 × 24</span><label class="checkbox-row"><input id="gridCheck" type="checkbox" checked>Grid</label></div>
      </div>
      <div class="tools">
        <div class="tool-grid" role="toolbar" aria-label="Drawing tools">
          <button type="button" class="icon-button active" id="pen" data-tool="pen" title="Pencil" aria-label="Pencil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 5-.8L20 8a2.8 2.8 0 0 0-4-4L5 15zM14 6l4 4"/></svg></button>
          <button type="button" class="icon-button" id="erase" data-tool="erase" title="Eraser" aria-label="Eraser"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 16 10-11a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3l-7 7H8zM9 10l8 8M13 20h8"/></svg></button>
          <button type="button" class="icon-button" id="fill" data-tool="fill" title="Fill" aria-label="Fill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 9-9 9-9-9zM9 3l6 6M3 21h18"/></svg></button>
          <button type="button" class="icon-button" id="pick" data-tool="pick" title="Pick color" aria-label="Pick color"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5 5 5M4 20l5-1 11-11a2.5 2.5 0 0 0-4-4L5 15z"/></svg></button>
        </div>
        <div class="tool-divider"></div>
        <div class="palette" id="palette" role="group" aria-label="HarbourOS palette"></div>
        <div class="visually-hidden"><label for="customColor">Legacy custom color</label><input type="color" id="customColor" value="#382209"><span id="colorCode">#382209</span></div>
        <div class="tool-divider"></div>
        <div class="tool-row" role="toolbar" aria-label="Edit">
          <button type="button" class="icon-button" id="undo" title="Undo" aria-label="Undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h9a7 7 0 0 1 0 14"/></svg></button>
          <button type="button" class="icon-button" id="redo" title="Redo" aria-label="Redo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5m5 5h-9a7 7 0 0 0 0 14"/></svg></button>
          <button type="button" class="icon-button" id="clearIcon" title="Clear icon" aria-label="Clear icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m-9 0 1 13h10l1-13M10 11v6m4-6v6"/></svg></button>
          <button type="button" class="icon-button" id="copyNext" title="Duplicate to next slot" aria-label="Duplicate to next slot"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="1"/><path d="M16 8V4H4v12h4"/></svg></button>
          <button type="button" class="icon-button" id="importPng" title="Import PNG" aria-label="Import PNG"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="m4 17 6-5 4 3 3-2 4 4"/></svg></button>
        </div>
        <input type="file" id="pngInput" accept="image/png,image/*">
        <div class="status" id="status" role="status" aria-live="polite">Saved locally</div>
      </div>
    </div>
  </section>
</main>
<script>
(function () {
  "use strict";
  var W = 24, TOTAL = 128, STORE = "harbour-icon-studio:v1";
  var defaults = ["Calculator","Clock","Dictionary","File","Folder","Fune","Graph","Preferences","Snake","Terminal","TextEditor","Trash","Home","Settings","Network","Music"];
  // Exact four-color Cardputer Zero theme: assets/themes/cardputer-zero.yaml
  var palette = ["#382209","#b8945c","#f0d6a0","#ffe8b8"];
  var canvas = document.getElementById("canvas"), ctx = canvas.getContext("2d", {willReadFrequently:true});
  var artboard = document.getElementById("artboard"), tiles = document.getElementById("tiles");
  var colorInput = document.getElementById("customColor"), nameInput = document.getElementById("iconName");
  var status = document.getElementById("status"), progress = document.getElementById("progress");
  var iconInfo = document.getElementById("indexInfo"), pixelInfo = document.getElementById("pixelInfo");
  var selected = 0, tool = "pen", color = "#382209", dragging = false, last = null;
  var saveTimer = null, dirty = false;
  var histories = Array.from({length:TOTAL},function(){return {undo:[],redo:[]};});
  function blank(i){return {id:i+1,name:defaults[i] || "Icon "+String(i+1).padStart(3,"0"),pixels:Array(W*W).fill(null)};}
  var icons = Array.from({length:TOTAL},function(_,i){return blank(i);});
  function byId(id){return document.getElementById(id);}
  function normalize(data){
    if(!data || data.format!=="harbour-icon-studio" || data.version!==1 || data.size!==W || !Array.isArray(data.icons) || data.icons.length!==TOTAL) throw Error("24×24・128枠のHarbour Icon Studio JSONではありません");
    return data.icons.map(function(item,i){
      if(!item || !Array.isArray(item.pixels) || item.pixels.length!==W*W) throw Error("Icon "+(i+1)+" のピクセル数が不正です");
      return {id:i+1,name:String(item.name || blank(i).name).slice(0,60),pixels:item.pixels.map(function(p){return typeof p==="string" && /^#[a-fA-F0-9]{6}$/.test(p)?p.toLowerCase():null;})};
    });
  }
  function load(){
    try{
      var raw=localStorage.getItem(STORE);
      if(raw){icons=normalize(JSON.parse(raw));status.textContent="Saved icons restored from this browser";}
    }catch(e){status.textContent="保存データを読めませんでした。JSONから復元できます。";}
  }
  function project(){return {format:"harbour-icon-studio",version:1,size:W,iconCount:TOTAL,icons:icons};}
  function saveNow(){
    if(saveTimer){clearTimeout(saveTimer);saveTimer=null;}
    try{localStorage.setItem(STORE,JSON.stringify(project()));dirty=false;status.textContent="Saved on this device";}
    catch(e){status.textContent="Web Storageに保存できません。Project JSONを書き出してください。";}
  }
  function queueSave(){dirty=true;status.textContent="Saving…";if(saveTimer)clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,350);}
  function pixelsToCanvas(pixels,target){
    var c=target.getContext("2d"), data=c.createImageData(W,W), p=data.data;
    for(var i=0;i<W*W;i++){
      var hex=pixels[i];if(!hex)continue;
      var n=i*4;p[n]=parseInt(hex.slice(1,3),16);p[n+1]=parseInt(hex.slice(3,5),16);p[n+2]=parseInt(hex.slice(5,7),16);p[n+3]=255;
    }
    c.putImageData(data,0,0);
  }
  function renderCanvas(){pixelsToCanvas(icons[selected].pixels,canvas);pixelInfo.textContent=W+" × "+W+" · "+icons[selected].pixels.filter(Boolean).length+" px";}
  function renderThumb(i){var tile=tiles.querySelector('[data-index="'+i+'"]');if(tile){pixelsToCanvas(icons[i].pixels,tile.querySelector("canvas"));tile.querySelector(".filename").textContent=icons[i].name;tile.setAttribute("aria-label",String(i+1)+" "+icons[i].name);}}
  function refreshProgress(){progress.textContent=icons.filter(function(x){return x.pixels.some(Boolean);}).length+" / "+TOTAL;}
  function renderTiles(){
    tiles.textContent="";
    var fragment=document.createDocumentFragment();
    icons.forEach(function(icon,i){
      var button=document.createElement("button");button.type="button";button.className="tile";button.dataset.index=String(i);button.setAttribute("aria-pressed",String(i===selected));
      var cv=document.createElement("canvas");cv.width=cv.height=W;
      var num=document.createElement("span");num.className="number";num.textContent=String(i+1).padStart(3,"0");
      var name=document.createElement("span");name.className="filename";name.textContent=icon.name;
      button.append(cv,num,name);button.addEventListener("click",function(){selectIcon(i);});
      fragment.append(button);
    });
    tiles.append(fragment);
    for(var i=0;i<TOTAL;i++)renderThumb(i);
    filterTiles();
  }
  function filterTiles(){
    var term=byId("search").value.trim().toLowerCase();
    tiles.querySelectorAll(".tile").forEach(function(el){
      var i=Number(el.dataset.index), match=!term || icons[i].name.toLowerCase().includes(term) || String(i+1).padStart(3,"0").includes(term);
      el.hidden=!match;el.style.display=match?"":"none";
    });
  }
  function selectIcon(i){
    if(dragging)stopStroke();
    selected=i;
    tiles.querySelectorAll(".tile").forEach(function(el){el.setAttribute("aria-pressed",String(Number(el.dataset.index)===i));});
    nameInput.value=icons[i].name;iconInfo.textContent=String(i+1).padStart(3,"0")+" / "+TOTAL;
    renderCanvas();refreshHistoryControls();
  }
  function pushUndo(){
    var h=histories[selected];h.undo.push(icons[selected].pixels.slice());if(h.undo.length>40)h.undo.shift();h.redo=[];
    refreshHistoryControls();
  }
  function refreshHistoryControls(){byId("undo").disabled=!histories[selected].undo.length;byId("redo").disabled=!histories[selected].redo.length;}
  function changePixels(){
    renderCanvas();renderThumb(selected);refreshProgress();queueSave();
  }
  function setPixel(x,y,value){
    var i=y*W+x;
    if(icons[selected].pixels[i]===value)return false;
    icons[selected].pixels[i]=value;return true;
  }
  function fillAt(x,y){
    var a=icons[selected].pixels, from=a[y*W+x], to=color;if(from===to)return;
    var stack=[y*W+x];a[y*W+x]=to;
    while(stack.length){
      var idx=stack.pop(),px=idx%W,py=(idx/W)|0;
      var neigh=[];
      if(px>0)neigh.push(idx-1);if(px<W-1)neigh.push(idx+1);
      if(py>0)neigh.push(idx-W);if(py<W-1)neigh.push(idx+W);
      neigh.forEach(function(k){if(a[k]===from){a[k]=to;stack.push(k);}});
    }
    changePixels();
  }
  function coords(e){
    var rect=canvas.getBoundingClientRect();
    return {x:Math.max(0,Math.min(W-1,Math.floor((e.clientX-rect.left)*W/rect.width))),y:Math.max(0,Math.min(W-1,Math.floor((e.clientY-rect.top)*W/rect.height)))};
  }
  function line(a,b,val){
    var x=a.x,y=a.y,dx=Math.abs(b.x-x),dy=Math.abs(b.y-y),sx=x<b.x?1:-1,sy=y<b.y?1:-1,err=dx-dy,changed=false;
    while(true){changed=setPixel(x,y,val)||changed;if(x===b.x&&y===b.y)break;var e2=err*2;if(e2>-dy){err-=dy;x+=sx;}if(e2<dx){err+=dx;y+=sy;}}
    if(changed)changePixels();
  }
  function stopStroke(){dragging=false;last=null;}
  canvas.addEventListener("pointerdown",function(e){
    if(e.pointerType==="mouse" && e.button!==0)return;
    e.preventDefault();canvas.setPointerCapture(e.pointerId);
    var pos=coords(e),old=icons[selected].pixels[pos.y*W+pos.x];
    if(tool==="pick"){
      if(old){setColor(old);setTool("pen");}
      return;
    }
    if(tool==="fill"){if(old!==color){pushUndo();fillAt(pos.x,pos.y);}return;}
    pushUndo();dragging=true;last=pos;line(pos,pos,tool==="erase"?null:color);
  });
  canvas.addEventListener("pointermove",function(e){if(!dragging)return;e.preventDefault();var pos=coords(e);line(last,pos,tool==="erase"?null:color);last=pos;});
  canvas.addEventListener("pointerup",stopStroke);canvas.addEventListener("pointercancel",stopStroke);window.addEventListener("blur",stopStroke);
  function setTool(t){tool=t;document.querySelectorAll("[data-tool]").forEach(function(b){b.classList.toggle("active",b.dataset.tool===t);b.setAttribute("aria-pressed",String(b.dataset.tool===t));});}
  document.querySelectorAll("[data-tool]").forEach(function(b){b.addEventListener("click",function(){setTool(b.dataset.tool);});});
  function setColor(c){
    color=c.toLowerCase();colorInput.value=color;byId("colorCode").textContent=color.toUpperCase();
    document.querySelectorAll(".swatch").forEach(function(b){b.classList.toggle("selected",b.dataset.color===color);});
  }
  palette.forEach(function(c){
    var b=document.createElement("button");b.type="button";b.className="swatch";b.dataset.color=c;b.style.backgroundColor=c;b.setAttribute("aria-label","Color "+c);
    b.addEventListener("click",function(){setColor(c);setTool("pen");});byId("palette").append(b);
  });
  colorInput.addEventListener("input",function(){setColor(colorInput.value);setTool("pen");});
  byId("undo").addEventListener("click",function(){
    var h=histories[selected];if(!h.undo.length)return;h.redo.push(icons[selected].pixels.slice());icons[selected].pixels=h.undo.pop();changePixels();refreshHistoryControls();
  });
  byId("redo").addEventListener("click",function(){
    var h=histories[selected];if(!h.redo.length)return;h.undo.push(icons[selected].pixels.slice());icons[selected].pixels=h.redo.pop();changePixels();refreshHistoryControls();
  });
  byId("clearIcon").addEventListener("click",function(){
    if(!icons[selected].pixels.some(Boolean) || !confirm("このアイコンの描画を消去しますか？"))return;
    pushUndo();icons[selected].pixels=Array(W*W).fill(null);changePixels();
  });
  byId("copyNext").addEventListener("click",function(){
    var next=(selected+1)%TOTAL;
    if(icons[next].pixels.some(Boolean) && !confirm("次のスロットの描画を上書きしますか？"))return;
    histories[next].undo.push(icons[next].pixels.slice());histories[next].redo=[];
    icons[next].pixels=icons[selected].pixels.slice();
    renderThumb(next);refreshProgress();queueSave();selectIcon(next);
  });
  byId("gridCheck").addEventListener("change",function(e){artboard.classList.toggle("grid-on",e.target.checked);});
  byId("search").addEventListener("input",filterTiles);
  nameInput.addEventListener("input",function(){icons[selected].name=nameInput.value.slice(0,60);renderThumb(selected);filterTiles();queueSave();});
  document.addEventListener("keydown",function(e){
    var edit=document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    if(edit)return;
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="z"){
      e.preventDefault();byId(e.shiftKey?"redo":"undo").click();
    }
  });
  function download(blob,filename){
    var url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=filename;
    document.body.append(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},15000);
  }
  function jsonText(){return JSON.stringify(project(),null,2);}
  byId("exportJson").addEventListener("click",function(){saveNow();download(new Blob([jsonText()],{type:"application/json;charset=utf-8"}),"harbour-icons-128.json");});
  byId("fileInput").addEventListener("change",async function(e){
    var file=e.target.files[0];if(!file)return;
    try{
      var incoming=normalize(JSON.parse(await file.text()));
      if(!confirm("現在の128アイコンを読み込んだJSONで置き換えますか？"))return;
      icons=incoming;histories=Array.from({length:TOTAL},function(){return {undo:[],redo:[]};});
      selected=0;renderTiles();selectIcon(0);refreshProgress();saveNow();status.textContent="Project JSON imported and saved";
    }catch(error){alert("読み込み失敗: "+error.message);}
    finally{e.target.value="";}
  });
  byId("importPng").addEventListener("click",function(){byId("pngInput").click();});
  byId("pngInput").addEventListener("change",async function(e){
    var file=e.target.files[0];if(!file)return;
    try{
      var bitmap=await createImageBitmap(file),tmp=document.createElement("canvas");
      tmp.width=tmp.height=W;var c=tmp.getContext("2d",{willReadFrequently:true});
      c.clearRect(0,0,W,W);c.imageSmoothingEnabled=false;c.drawImage(bitmap,0,0,W,W);bitmap.close();
      var raw=c.getImageData(0,0,W,W).data, p=[];
      for(var i=0;i<W*W;i++){var k=i*4;p.push(raw[k+3]>=128?"#"+[raw[k],raw[k+1],raw[k+2]].map(function(n){return n.toString(16).padStart(2,"0");}).join(""):null);}
      pushUndo();icons[selected].pixels=p;changePixels();
    }catch(error){alert("PNGを読み込めませんでした: "+error.message);}
    finally{e.target.value="";}
  });
  // ZIP format (stored entries, no external libraries or network dependency).
  var crcTable=Array.from({length:256},function(_,n){for(var j=0;j<8;j++)n=(n&1)?(0xedb88320^(n>>>1)):(n>>>1);return n>>>0;});
  function crc32(bytes){var c=0xffffffff;for(var i=0;i<bytes.length;i++)c=crcTable[(c^bytes[i])&255]^(c>>>8);return (c^0xffffffff)>>>0;}
  function header(length){return new DataView(new ArrayBuffer(length));}
  function put16(v,i,n){v.setUint16(i,n,true);}
  function put32(v,i,n){v.setUint32(i,n>>>0,true);}
  function bytes(v){return new Uint8Array(v.buffer);}
  function makeZip(files){
    var output=[],central=[],offset=0,encoder=new TextEncoder();
    files.forEach(function(item){
      var name=encoder.encode(item.name),data=item.data,crc=crc32(data);
      var local=header(30);
      put32(local,0,0x04034b50);put16(local,4,20);put16(local,6,0x0800);put16(local,8,0);
      put32(local,14,crc);put32(local,18,data.length);put32(local,22,data.length);put16(local,26,name.length);
      output.push(bytes(local),name,data);
      var dir=header(46);
      put32(dir,0,0x02014b50);put16(dir,4,20);put16(dir,6,20);put16(dir,8,0x0800);
      put32(dir,16,crc);put32(dir,20,data.length);put32(dir,24,data.length);
      put16(dir,28,name.length);put32(dir,42,offset);
      central.push(bytes(dir),name);
      offset+=30+name.length+data.length;
    });
    var centralLength=central.reduce(function(n,a){return n+a.length;},0),end=header(22);
    put32(end,0,0x06054b50);put16(end,8,files.length);put16(end,10,files.length);put32(end,12,centralLength);put32(end,16,offset);
    return new Blob(output.concat(central,[bytes(end)]),{type:"application/zip"});
  }
  function safeName(s){return (s.trim().replace(/[^a-zA-Z0-9_-]+/g,"-").replace(/^-|-$/g,"").slice(0,45)||"icon").toLowerCase();}
  function pngBytes(pixels){
    return new Promise(function(resolve,reject){
      var cv=document.createElement("canvas");cv.width=cv.height=W;pixelsToCanvas(pixels,cv);
      cv.toBlob(function(blob){if(!blob){reject(Error("PNG encoding failed"));return;}blob.arrayBuffer().then(function(buffer){resolve(new Uint8Array(buffer));},reject);},"image/png");
    });
  }
  byId("exportZip").addEventListener("click",async function(){
    var button=this;button.disabled=true;saveNow();
    try{
      var files=[{name:"harbour-icons-128.json",data:new TextEncoder().encode(jsonText())}];
      for(var i=0;i<TOTAL;i++){
        status.textContent="Creating PNG ZIP "+(i+1)+"/"+TOTAL+"…";
        files.push({name:"icons/"+String(i+1).padStart(3,"0")+"-"+safeName(icons[i].name)+".png",data:await pngBytes(icons[i].pixels)});
      }
      download(makeZip(files),"harbour-icons-128.zip");status.textContent="PNG ZIP exported";
    }catch(error){alert("ZIP書き出しに失敗しました: "+error.message);}
    finally{button.disabled=false;}
  });
  load();renderTiles();selectIcon(0);setColor(color);setTool(tool);refreshProgress();
  window.addEventListener("pagehide",function(){if(dirty)saveNow();});
  document.addEventListener("visibilitychange",function(){if(document.hidden && dirty)saveNow();});
})();
</script>
