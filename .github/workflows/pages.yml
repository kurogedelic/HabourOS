name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build web version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten

      # ローカルで動作確認した Emscripten と同じ版に固定
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 5.0.4
          actions-cache-folder: emsdk-cache

      - name: Build
        run: ./web/build.sh

      - name: Collect site
        run: |
          mkdir -p _site
          cp web/index.html web/main.js web/cardputer-zero.html web/cardputer-zero.js \
            web/harbour_shell.js web/harbour_shell.wasm web/harbour_shell.data _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
